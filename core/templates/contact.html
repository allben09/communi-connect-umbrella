{% extends 'base.html' %}
{% block title %}Contact – Communi-Connect Umbrella{% endblock %}
{% block content %}
<section class="section">
    <div class="container">
        <h2 class="section-title">Contact Us</h2>
        <p class="section-subtitle">We'd love to hear from you.</p>
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <form method="POST" class="card-modern">
                    {% csrf_token %}
                    <input type="text" name="name" class="form-control-modern" placeholder="Your Name" required>
                    <input type="email" name="email" class="form-control-modern" placeholder="Your Email" required>
                    <input type="text" name="subject" class="form-control-modern" placeholder="Subject" required>
                    <textarea name="message" class="form-control-modern" placeholder="Your Message" rows="4" required></textarea>
                    <button type="submit" class="btn-primary-custom w-100">Send Message <i class="fas fa-paper-plane ms-1"></i></button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
